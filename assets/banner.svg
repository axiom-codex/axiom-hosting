<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="18"/>

  <!-- Glow circles -->
  <circle cx="100" cy="100" r="80" fill="#7c3aed" opacity="0.15" filter="url(#blur)"/>
  <circle cx="800" cy="100" r="80" fill="#2563eb" opacity="0.15" filter="url(#blur)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="4" fill="url(#glow)" rx="2"/>

  <!-- Robot icon (left) -->
  <g transform="translate(55, 55)">
    <!-- Head -->
    <rect x="10" y="10" width="50" height="42" rx="8" fill="#7c3aed" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="25" cy="28" r="6" fill="#fff"/>
    <circle cx="45" cy="28" r="6" fill="#fff"/>
    <circle cx="26" cy="29" r="3" fill="#2563eb"/>
    <circle cx="46" cy="29" r="3" fill="#2563eb"/>
    <!-- Mouth -->
    <rect x="22" y="40" width="26" height="5" rx="3" fill="#fff" opacity="0.7"/>
    <!-- Antenna -->
    <rect x="33" y="2" width="4" height="10" rx="2" fill="#a78bfa"/>
    <circle cx="35" cy="2" r="4" fill="#60a5fa"/>
    <!-- Body -->
    <rect x="5" y="56" width="60" height="32" rx="6" fill="#6d28d9" opacity="0.8"/>
    <!-- Chest light -->
    <rect x="22" y="64" width="26" height="5" rx="3" fill="#60a5fa" opacity="0.9"/>
    <circle cx="35" cy="79" r="4" fill="#a78bfa"/>
  </g>

  <!-- Title -->
  <text x="165" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#glow)">AXIS HOSTING</text>

  <!-- Tagline -->
  <text x="167" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#c4b5fd" letter-spacing="2">⚡ 24/7 Discord Bot Hosting — Always Online</text>

  <!-- Badges row -->
  <!-- Badge 1: Free -->
  <rect x="167" y="135" width="90" height="28" rx="14" fill="#16a34a" opacity="0.9"/>
  <text x="212" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">🆓 FREE</text>

  <!-- Badge 2: 24/7 -->
  <rect x="267" y="135" width="100" height="28" rx="14" fill="#2563eb" opacity="0.9"/>
  <text x="317" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⏰ 24/7</text>

  <!-- Badge 3: Auto-Restart -->
  <rect x="377" y="135" width="145" height="28" rx="14" fill="#7c3aed" opacity="0.9"/>
  <text x="449" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">🔄 Auto-Restart</text>

  <!-- Badge 4: Real-Time -->
  <rect x="532" y="135" width="135" height="28" rx="14" fill="#db2777" opacity="0.9"/>
  <text x="599" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⚡ Real-Time</text>

  <!-- Bottom accent -->
  <rect x="0" y="196" width="900" height="4" fill="url(#glow)" rx="2"/>

  <!-- Stars decoration -->
  <text x="820" y="50" font-size="18" fill="#a78bfa" opacity="0.6">★</text>
  <text x="850" y="80" font-size="12" fill="#60a5fa" opacity="0.5">★</text>
  <text x="840" y="110" font-size="22" fill="#7c3aed" opacity="0.4">★</text>
</svg>